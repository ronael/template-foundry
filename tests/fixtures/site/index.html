<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Template Foundry Fixture</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #111;
      }
      header,
      main,
      footer {
        padding: 24px;
      }
      .mobile-overflow {
        width: 620px;
        padding: 16px;
        background: #f2f2f2;
      }
      .tiny-link {
        display: inline-flex;
        width: 22px;
        height: 22px;
        align-items: center;
        justify-content: center;
        background: #111;
        color: #fff;
      }
      button.icon-only {
        width: 24px;
        height: 24px;
      }
      @media (min-width: 700px) {
        .mobile-overflow {
          width: auto;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Fixture Template</h1>
      <nav>
        <a href="/good.html">Good page</a>
        <a href="/missing.html">Broken internal link</a>
        <a href="#not-present">Broken anchor</a>
        <a class="tiny-link" href="/good.html" aria-label="Tiny target">→</a>
      </nav>
    </header>
    <main>
      <section class="mobile-overflow" data-testid="overflow-block">
        This block intentionally overflows narrow mobile viewports.
      </section>
      <img src="/assets/missing-product.png" alt="Missing product preview" />
      <button class="icon-only" type="button"></button>
    </main>
    <footer>Fixture footer</footer>
    <script>
      console.error("Intentional fixture console error");
      setTimeout(() => {
        throw new Error("Intentional fixture page exception");
      }, 0);
    </script>
  </body>
</html>
